<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1c2128"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3d2b2b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="targetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b4a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff6b4a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow)"/>

  <circle cx="600" cy="170" r="150" fill="url(#targetGlow)"/>

  <g opacity="0.18" stroke="#ffffff" stroke-width="1.5" fill="none">
    <circle cx="150" cy="80" r="45"/>
    <circle cx="150" cy="80" r="25"/>
    <line x1="90" y1="80" x2="130" y2="80"/>
    <line x1="170" y1="80" x2="210" y2="80"/>
    <line x1="150" y1="20" x2="150" y2="60"/>
    <line x1="150" y1="100" x2="150" y2="140"/>
  </g>

  <g opacity="0.15" stroke="#ffffff" stroke-width="1.5" fill="none">
    <circle cx="1050" cy="280" r="55"/>
    <circle cx="1050" cy="280" r="30"/>
    <line x1="975" y1="280" x2="1025" y2="280"/>
    <line x1="1075" y1="280" x2="1125" y2="280"/>
    <line x1="1050" y1="205" x2="1050" y2="255"/>
    <line x1="1050" y1="305" x2="1050" y2="355"/>
  </g>

  <g opacity="0.1" stroke="#ff8a65" stroke-width="1">
    <circle cx="600" cy="150" r="90"/>
    <circle cx="600" cy="150" r="60"/>
  </g>

  <g opacity="0.12">
    <line x1="60" y1="300" x2="220" y2="300" stroke="#ffffff" stroke-width="1"/>
    <line x1="980" y1="60" x2="1140" y2="60" stroke="#ffffff" stroke-width="1"/>
  </g>

  <circle cx="250" cy="250" r="3" fill="#ffffff" opacity="0.3"/>
  <circle cx="950" cy="120" r="2.5" fill="#ffffff" opacity="0.25"/>
  <circle cx="90" cy="180" r="2" fill="#ff8a65" opacity="0.3"/>
  <circle cx="1120" cy="200" r="2" fill="#ff8a65" opacity="0.25"/>

  <text x="600" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="60.0" font-weight="700" fill="#ffffff">
    <tspan>Deagle Arena Script</tspan>
  </text>

  <text x="600" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21.0" fill="#c9d1d9">
    <tspan x="600" dy="0">Small Windows tool for Deagle Arena practice — set up drills fast</tspan>
    <tspan x="600" dy="30">and track your aim progress.</tspan>
  </text>
</svg>